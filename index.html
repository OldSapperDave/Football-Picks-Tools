<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ---------- team dictionary ----------
const TEAMS = {
  ARI: ["arizona", "cardinals", "ari"], ATL: ["atlanta", "falcons", "atl"],
  BAL: ["baltimore", "ravens", "bal"], BUF: ["buffalo", "bills", "buf"],
  CAR: ["carolina", "panthers", "car"], CHI: ["chicago", "bears", "chi"],
  CIN: ["cincinnati", "bengals", "cin"], CLE: ["cleveland", "browns", "cle"],
  DAL: ["dallas", "cowboys", "dal"], DEN: ["denver", "broncos", "den"],
  DET: ["detroit", "lions", "det"], GB: ["green bay", "packers", "gb", "gnb"],
  HOU: ["houston", "texans", "hou"], IND: ["indianapolis", "colts", "ind"],
  JAX: ["jacksonville", "jaguars", "jax", "jac"], KC: ["kansas city", "chiefs", "kc", "kan"],
  LV: ["las vegas", "raiders", "lv", "lvr", "oak"], LAC: ["chargers", "lac", "sd"],
  LAR: ["rams", "lar", "stl"], MIA: ["miami", "dolphins", "mia"],
  MIN: ["minnesota", "vikings", "min"], NE: ["new england", "patriots", "ne", "nwe"],
  NO: ["new orleans", "saints", "no", "nor"], NYG: ["giants", "nyg"],
  NYJ: ["jets", "nyj"], PHI: ["philadelphia", "eagles", "phi"],
  PIT: ["pittsburgh", "steelers", "pit"], SF: ["san francisco", "49ers", "sf", "sfo"],
  SEA: ["seattle", "seahawks", "sea"], TB: ["tampa bay", "buccaneers", "bucs", "tb", "tam"],
  TEN: ["tennessee", "titans", "ten"], WAS: ["washington", "commanders", "was", "wsh"],
};
// longest alias first so "san francisco" beats "sf"
const ALIASES = Object.entries(TEAMS)
  .flatMap(([abbr, names]) => names.map((n) => ({ abbr, n })))
  .sort((a, b) => b.n.length - a.n.length);

function findTeams(text) {
  // returns [{abbr, idx}] in order of appearance
  const lower = text.toLowerCase();
  const hits = [];
  for (const { abbr, n } of ALIASES) {
    const re = new RegExp(`(^|[^a-z])${n.replace(/ /g, "\\s+")}(?=$|[^a-z])`, "g");
    let m;
    while ((m = re.exec(lower))) {
      const idx = m.index + m[1].length;
      if (!hits.some((h) => h.abbr === abbr) && !hits.some((h) => Math.abs(h.idx - idx) < 2))
        hits.push({ abbr, idx, len: n.length });
    }
  }
  return hits.sort((a, b) => a.idx - b.idx);
}

// ---------- parsers ----------
// Yahoo / DK paste: one game per line, e.g.
//   "Bills @ Jets (-3.5)"   "BUF -3.5 at NYJ"   "KC vs LAC -2.5"
// The spread applies to the team it sits closest to. Output: home spread.
function parseLines(text) {
  const games = {};
  for (const raw of text.split(/\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const teams = findTeams(line);
    if (teams.length < 2) continue;
    const numMatch = [...line.matchAll(/([+-]\s?\d+(?:\.\d+)?)|(\bPK\b|\bPICK\b)/gi)][0];
    if (!numMatch) continue;
    let spread = numMatch[2] ? 0 : parseFloat(numMatch[1].replace(/\s/, ""));
    const nIdx = numMatch.index;
    const [a, b] = teams;
    const isVs = /\bvs\.?\b/i.test(line);
    const away = isVs ? b.abbr : a.abbr; // "A vs B" => A is home
    const home = isVs ? a.abbr : b.abbr;
    const nearFirst = Math.abs(nIdx - a.idx) < Math.abs(nIdx - b.idx);
    const spreadTeam = nearFirst ? a.abbr : b.abbr;
    const homeSpread = spreadTeam === home ? spread : -spread;
    games[`${away}@${home}`] = { away, home, spread: homeSpread };
  }
  return games;
}

// FTN DVOA table paste: any line containing a team and a percentage.
function parseDvoa(text) {
  const out = {};
  for (const raw of text.split(/\n/)) {
    const teams = findTeams(raw);
    const pct = raw.match(/(-?\d+(?:\.\d+)?)\s*%/);
    if (teams.length && pct) out[teams[0].abbr] = parseFloat(pct[1]);
  }
  return out;
}

// ---------- FTN DVOA game projections ----------
// Accepts rows of projected scores ("Seattle 27.1  Arizona 20.4", "SEA 27 - ARI 20")
// or an explicit spread ("SEA @ ARI -6.5"). Returns {AWAY@HOME: homeSpread}.
function parseProjections(text) {
  parseProjections.scores = {};
  // FTN's table is "Week | Home | Away | Home Pts | Away Pts" — home FIRST, the
  // opposite of the Yahoo/DK convention. Detect the order from a header row if one
  // is present; otherwise assume away-first ("A @ B") unless "vs" says otherwise.
  const header = text.split(/\n/).find((l) => /home/i.test(l) && /away/i.test(l));
  const homeFirst = header ? header.toLowerCase().indexOf("home") < header.toLowerCase().indexOf("away") : null;
  const out = {};
  for (const raw of text.split(/\n/)) {
    const line = raw.trim();
    if (!line || /home\s*pts/i.test(line)) continue;
    const teams = findTeams(line);
    if (teams.length < 2) continue;
    const [t1, t2] = teams;
    const vs = /\bvs\.?\b/i.test(line.slice(t1.idx, t2.idx));
    const firstIsHome = homeFirst !== null ? homeFirst : vs;
    const home = firstIsHome ? t1.abbr : t2.abbr;
    const away = firstIsHome ? t2.abbr : t1.abbr;
    const nums = [...line.matchAll(/(?<![\d.%-])(-?\d{1,3}(?:\.\d+)?)(?![\d.]*%)/g)]
      .map((m) => ({ v: parseFloat(m[1]), i: m.index }))
      .filter((n) => n.i > t1.idx || n.v < 0);          // ignore leading week/rank numbers
    const scores = nums.filter((n) => n.v >= 0 && n.v <= 60);
    if (scores.length >= 2) {
      const [p1, p2] = [scores[scores.length - 2].v, scores[scores.length - 1].v];
      const homePts = firstIsHome ? p1 : p2;
      const awayPts = firstIsHome ? p2 : p1;
      out[`${away}@${home}`] = Math.round((awayPts - homePts) * 2) / 2;
      parseProjections.scores[`${away}@${home}`] = { away: awayPts, home: homePts };
      continue;
    }
    const signed = nums.find((n) => n.v < 0);
    if (signed) {
      const team = Math.abs(signed.i - t1.idx) < Math.abs(signed.i - t2.idx) ? t1.abbr : t2.abbr;
      out[`${away}@${home}`] = team === home ? signed.v : -signed.v;
    }
  }
  return out;
}

// ---------- The Odds API (DraftKings) ----------
async function fetchDraftKings(key) {
  const url = `https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey=${key}&regions=us&markets=spreads&bookmakers=draftkings&oddsFormat=american`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Odds API ${r.status}: ${(await r.text()).slice(0, 120)}`);
  const data = await r.json();
  const games = {};
  for (const ev of data) {
    const home = findTeams(ev.home_team)[0]?.abbr;
    const away = findTeams(ev.away_team)[0]?.abbr;
    const mkt = ev.bookmakers?.[0]?.markets?.find((m) => m.key === "spreads");
    const homeOut = mkt?.outcomes?.find((o) => o.name === ev.home_team);
    if (home && away && homeOut) games[`${away}@${home}`] = { away, home, spread: homeOut.point, kickoff: ev.commence_time };
  }
  return games;
}

// ---------- sample data ----------
const SAMPLE_YAHOO = `Bills @ Jets (-3)
Chiefs @ Chargers +2.5
Lions -6.5 @ Bears
Eagles vs Cowboys +3.5
Ravens @ Bengals -1
49ers @ Rams +4
Packers -7 @ Panthers
Steelers @ Browns PK`;
const SAMPLE_DK = `Bills @ Jets -1.5
Chiefs @ Chargers +1
Lions -9.5 @ Bears
Eagles vs Cowboys +6.5
Ravens @ Bengals -3
49ers @ Rams +1.5
Packers -7 @ Panthers
Steelers @ Browns -2.5`;
const SAMPLE_DVOA = `1 DET 31.4%
2 PHI 28.9%
3 BAL 27.0%
4 KC 22.5%
5 BUF 21.8%
6 SF 18.2%
7 GB 15.6%
8 LAC 12.0%
9 CIN 8.1%
10 PIT 4.4%
11 LAR 2.2%
12 DAL -3.5%
13 NYJ -6.0%
14 CLE -8.2%
15 CHI -12.9%
16 CAR -21.4%`;

// ---------- helpers ----------
const fmt = (n) => (n == null ? "—" : n === 0 ? "PK" : n > 0 ? `+${n}` : `${n}`);
const KEYS = [3, 7];
const crossesKey = (a, b) =>
  a != null && b != null && KEYS.some((k) => (Math.abs(a) - k) * (Math.abs(b) - k) < 0 || Math.abs(a) === k !== (Math.abs(b) === k));

function App() {
  const [yahooText, setYahooText] = useState("");
  const [dkText, setDkText] = useState("");
  const [dvoaText, setDvoaText] = useState("");
  const [apiKey, setApiKey] = useState("");
  const [dkFetched, setDkFetched] = useState(null);
  const [fetchState, setFetchState] = useState({ status: "idle", msg: "" });
  const [k, setK] = useState(0.28); // points per DVOA point
  const [hfa, setHfa] = useState(1.5);
  const [minEdge, setMinEdge] = useState(1);
  const [pickPct, setPickPct] = useState({});
  const [ftnProj, setFtnProj] = useState({});
  const [projText, setProjText] = useState("");
  const [meta, setMeta] = useState({});
  const [consensus, setConsensus] = useState({});
  const [kickoff, setKickoff] = useState({});
  const [totals, setTotals] = useState({});
  const [sortBy, setSortBy] = useState("kickoff"); // "kickoff" | "edge"
  const [pinnacle, setPinnacle] = useState({});
  const [marketSrc, setMarketSrc] = useState("consensus"); // which line "vs market" compares against
  const [picks, setPicks] = useState({});   // key -> team
  const [conf, setConf] = useState({});     // key -> 1..N
  const [why, setWhy] = useState({});       // key -> reason the suggester ranked it there
  const [minMkt, setMinMkt] = useState(1);  // market gap must be at least this to count as an edge
  const [minFtn, setMinFtn] = useState(1);  // model gap must be at least this to be the tiebreak

  const yahoo = useMemo(() => parseLines(yahooText), [yahooText]);
  const dk = useMemo(() => dkFetched ?? parseLines(dkText), [dkFetched, dkText]);
  const dvoa = useMemo(() => parseDvoa(dvoaText), [dvoaText]);

  const proj = useMemo(() => {
    const pasted = parseProjections(projText);
    return Object.keys(pasted).length ? pasted : ftnProj;
  }, [projText, ftnProj]);
  const projScoresDerived = useMemo(() => { parseProjections(projText); return { ...parseProjections.scores }; }, [projText]);

  const rows = useMemo(() => {
    const keys = new Set([...Object.keys(yahoo), ...Object.keys(dk)]);
    return [...keys]
      .map((key) => {
        const g = yahoo[key] || dk[key];
        const y = yahoo[key]?.spread ?? null;
        const dkLine = dk[key]?.spread ?? null;
        const cons = consensus[key] ?? null;
        const pin = pinnacle[key] ?? null;
        const d = marketSrc === "pinnacle" && pin != null ? pin : marketSrc === "consensus" && cons != null ? cons : dkLine;
        const hd = dvoa[g.home], ad = dvoa[g.away];
        const hasProj = proj[key] != null;
        const m = hasProj ? proj[key] : hd != null && ad != null ? -((hd - ad) * k + hfa) : null;
        const mkt = y != null && d != null ? y - d : null; // + => home gets more pts on Yahoo
        const mdl = y != null && m != null ? y - m : null;
        const side = (v) => (v == null ? null : v > 0 ? g.home : v < 0 ? g.away : null);
        const mSide = side(mkt), dSide = side(mdl);
        const agree = mSide && dSide && mSide === dSide;
        const score = Math.abs(mkt ?? 0) + 0.5 * Math.abs(mdl ?? 0);
        const ko = kickoff[key] ? new Date(kickoff[key]) : null;
        return { key, ...g, y, d, dkLine, cons, pin, m, hasProj, mkt, mdl, mSide, dSide, agree, score, keyCross: crossesKey(y, d), ko, started: ko ? ko < new Date() : false };
      })
      .sort((a, b) => sortBy === "kickoff"
        ? ((a.ko ? a.ko.getTime() : Infinity) - (b.ko ? b.ko.getTime() : Infinity)) || b.score - a.score
        : b.score - a.score || ((a.ko ? a.ko.getTime() : Infinity) - (b.ko ? b.ko.getTime() : Infinity)));
  }, [yahoo, dk, dvoa, k, hfa, proj, consensus, pinnacle, marketSrc, kickoff, sortBy]);
  const fmtKo = (d) => d ? d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "—";
  // Sunday night + Monday night games (local time) — Yahoo's tiebreaker games
  const tiebreakers = useMemo(() => rows.filter((r) => {
    if (!r.ko) return false;
    const day = r.ko.getDay(), hr = r.ko.getHours();
    return (day === 0 && hr >= 19) || day === 1;
  }), [rows]);
  const implied = (r) => {
    const t = totals[r.key], sp = r.d; // consensus/DK home spread (neg = home favored)
    if (t == null || sp == null) return null;
    return { home: (t - sp) / 2, away: (t + sp) / 2 };
  };


  const [bundleText, setBundleText] = useState("");
  const [bundleMsg, setBundleMsg] = useState("");
  const gamesToText = (g) => Object.entries(g).map(([k, v]) => `${k.split("@")[0]} @ ${k.split("@")[1]} ${fmt(v)}`).join("\n");
  const [bundleUrl, setBundleUrl] = useState("");
  const applyBundle = (b) => {
    if (b.yahoo) setYahooText(gamesToText(b.yahoo));
    setPickPct(b.yahoo_pick_pct || {});
    if (b.ftn_proj && Object.keys(b.ftn_proj).length) setFtnProj(b.ftn_proj);
    setConsensus(b.consensus || {});
    setKickoff(b.kickoff || {});
    setTotals(b.totals || {});
    setPinnacle(b.pinnacle || {});
    if (!b.consensus || !Object.keys(b.consensus).length) setMarketSrc("dk");
    setMeta({ pulled: b.pulled_at, season: b.dvoa_season, proj: Object.keys(b.ftn_proj || {}).length });
    if (b.dk) { setDkFetched(null); setDkText(gamesToText(b.dk)); }
    if (b.dvoa) setDvoaText(Object.entries(b.dvoa).map(([t, v]) => `${t} ${v}%`).join("\n"));
    setBundleMsg(`Imported ${Object.keys(b.yahoo || {}).length} Yahoo, ${Object.keys(b.dk || {}).length} DK, ${Object.keys(b.dvoa || {}).length} DVOA${b.pulled_at ? ` (pulled ${b.pulled_at})` : ""}`);
  };
  const loadUrl = async () => {
    try {
      const r = await fetch(bundleUrl.trim());
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      applyBundle(await r.json());
    } catch (e) { setBundleMsg(`Couldn't load that URL (${e.message}). Use the raw.githubusercontent.com link.`); }
  };
  useEffect(() => {
    fetch(`week.json?t=${Date.now()}`)
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
      .then(applyBundle)
      .catch((e) => setBundleMsg(`No week.json found next to this page yet (${e.message}). Run the workflow, then reload.`));
  }, []);
  const importBundle = () => {
    try {
      const b = JSON.parse(bundleText);
      applyBundle(b);
    } catch (e) { setBundleMsg("That isn't valid JSON from scrape_picks.py"); }
  };
  useEffect(() => { try { const s = JSON.parse(localStorage.getItem("picks-v1") || "null"); if (s) { setPicks(s.picks || {}); setConf(s.conf || {}); } } catch (e) {} }, []);
  useEffect(() => { try { localStorage.setItem("picks-v1", JSON.stringify({ picks, conf })); } catch (e) {} }, [picks, conf]);
  const nGames = rows.length;
  const setPick = (key, team) => setPicks((p) => ({ ...p, [key]: p[key] === team ? undefined : team }));
  const setConfidence = (key, n) => setConf((c) => {
    const next = { ...c };
    const holder = Object.keys(next).find((k) => next[k] === n && k !== key);
    if (holder) next[holder] = next[key]; // swap with whoever had that number
    next[key] = n;
    if (!n) delete next[key];
    return next;
  });
  const MODEL_TRUST = 4; // model gap is capped at this many points when ranking
  const suggest = () => {
    // Tier 1: Yahoo differs from the market by at least minMkt  -> pick the side Yahoo overpays; rank by gap size.
    // Tier 2: otherwise, FTN differs from Yahoo by at least minFtn -> pick FTN's side; rank by (capped) gap size.
    // Tier 3: otherwise, market favorite; rank by how big a favorite.
    // Half-point gaps are rounding noise between books, hence the thresholds.
    const scored = rows.map((r) => {
      const mkt = r.mkt ?? 0;
      const mdlRaw = r.mdl ?? 0;
      const mdl = Math.max(-MODEL_TRUST, Math.min(MODEL_TRUST, mdlRaw));
      let team, why, tier, strength;
      if (Math.abs(mkt) >= minMkt) {
        tier = 3; team = mkt > 0 ? r.home : r.away; strength = Math.abs(mkt);
        why = `Yahoo off market by ${Math.abs(mkt).toFixed(1)}`;
        if (Math.sign(mdl) === Math.sign(mkt) && Math.abs(mdl) >= 0.5) { strength += 0.01 * Math.abs(mdl); why += ", FTN agrees"; }
        else if (Math.abs(mdl) >= minFtn) { strength -= 0.01 * Math.abs(mdl); why += ", FTN disagrees"; }
      } else if (Math.abs(mdl) >= minFtn) {
        tier = 2; team = mdl > 0 ? r.home : r.away; strength = Math.abs(mdl);
        why = `FTN off Yahoo by ${Math.abs(mdlRaw).toFixed(1)}${Math.abs(mdlRaw) > MODEL_TRUST ? ` (capped ${MODEL_TRUST})` : ""}`;
      } else if (r.d != null && r.d !== 0) {
        tier = 1; team = r.d < 0 ? r.home : r.away; strength = Math.abs(r.d);
        why = `no edge; market favorite by ${Math.abs(r.d).toFixed(1)}`;
      } else { tier = 0; team = r.home; strength = 0; why = "no signal"; }
      return { key: r.key, team, tier, strength, why };
    }).sort((a, b) => b.tier - a.tier || b.strength - a.strength);
    const p = {}, c = {}, w = {};
    scored.forEach((g, i) => { p[g.key] = g.team; c[g.key] = scored.length - i; w[g.key] = g.why; });
    setPicks(p); setConf(c); setWhy(w);
  };
  const clearPicks = () => { setPicks({}); setConf({}); setWhy({}); };
  const picksText = () => rows.filter((r) => picks[r.key]).sort((a, b) => (conf[b.key] || 0) - (conf[a.key] || 0))
    .map((r) => `${conf[r.key] ?? "-"}  ${picks[r.key]}  (${r.away} @ ${r.home})`).join("\n");
  const usedConf = new Set(Object.values(conf));
  const loadSample = () => {
    setYahooText(SAMPLE_YAHOO); setDkText(SAMPLE_DK); setDvoaText(SAMPLE_DVOA); setDkFetched(null);
  };
  const pullDk = async () => {
    setFetchState({ status: "loading", msg: "" });
    try {
      const g = await fetchDraftKings(apiKey.trim());
      setDkFetched(g);
      setFetchState({ status: "ok", msg: `${Object.keys(g).length} games pulled from DraftKings` });
    } catch (e) {
      setFetchState({ status: "err", msg: e.message });
    }
  };

  const C = { ink: "#1C2530", mute: "#6B7684", line: "#D5DAE0", bg: "#F3F5F7", y: "#7A4CC8", dk: "#0E7C5B", model: "#B8641A", flag: "#C8281E" };
  const box = { background: "#fff", border: `1px solid ${C.line}`, borderRadius: 6 };
  const ta = { ...box, width: "100%", minHeight: 150, padding: 10, fontSize: 13, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", resize: "vertical", color: C.ink };
  const lbl = { fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 4 };
  const hint = { fontSize: 12, color: C.mute, marginBottom: 6, lineHeight: 1.4 };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.ink, fontFamily: "'Avenir Next', 'Segoe UI', system-ui, sans-serif", padding: "24px 20px 60px" }}>
      <div style={{ maxWidth: 1180, margin: "0 auto" }}>
        <header style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
          <div>
            <h1 style={{ fontSize: 26, fontWeight: 700, margin: 0, letterSpacing: -0.3 }}>Where the Yahoo line is wrong</h1>
            {meta.pulled && (
              <div style={{ fontSize: 13, color: C.mute, marginTop: 4 }}>
                Data pulled {meta.pulled} · DVOA season: <span style={{ fontWeight: 600, color: meta.season && +meta.season < new Date().getFullYear() ? C.flag : C.ink }}>{meta.season || "unknown"}</span>
                {meta.season && +meta.season < new Date().getFullYear() ? " (last season — not current)" : ""}
                {meta.proj ? ` · FTN projections: ${meta.proj} games` : " · FTN projections: none"}
              </div>
            )}
          </div>
          <button onClick={loadSample} style={{ ...box, padding: "6px 12px", fontSize: 13, cursor: "pointer" }}>Load sample week</button>
        </header>

        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap" }}>
          <textarea value={bundleText} onChange={(e) => setBundleText(e.target.value)} placeholder="Paste week.json from scrape_picks.py" style={{ ...ta, minHeight: 40, height: 40, flex: 1, minWidth: 260 }} />
          <input value={bundleUrl} onChange={(e) => setBundleUrl(e.target.value)} placeholder="…or raw GitHub URL of week.json" style={{ ...box, height: 40, padding: "6px 10px", fontSize: 13, flex: 1, minWidth: 240 }} />
          <button onClick={loadUrl} disabled={!bundleUrl} style={{ ...box, padding: "9px 14px", fontSize: 13, cursor: "pointer", opacity: bundleUrl ? 1 : 0.5 }}>Load from URL</button>
          <button onClick={importBundle} disabled={!bundleText} style={{ ...box, padding: "9px 14px", fontSize: 13, cursor: "pointer", opacity: bundleText ? 1 : 0.5 }}>Import bundle</button>
          {bundleMsg && <div style={{ ...hint, alignSelf: "center", margin: 0 }}>{bundleMsg}</div>}
        </div>

        {/* inputs */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 16, marginBottom: 20 }}>
          <div>
            <div style={{ ...lbl, color: C.y }}>Yahoo league lines</div>
            <div style={hint}>Copy the week's games off your Pick'em page. One game per line; the spread attaches to the nearest team. "@" or "at" = second team is home; "vs" = first team is home.</div>
            <textarea style={ta} value={yahooText} onChange={(e) => setYahooText(e.target.value)} placeholder={"Bills @ Jets (-3)\nEagles vs Cowboys +3.5"} />
            <div style={hint}>{Object.keys(yahoo).length} games parsed</div>
          </div>
          <div>
            <div style={{ ...lbl, color: C.dk }}>DraftKings lines</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
              <input value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="the-odds-api.com key" style={{ ...box, flex: 1, padding: "6px 8px", fontSize: 13 }} />
              <button onClick={pullDk} disabled={!apiKey || fetchState.status === "loading"} style={{ ...box, padding: "6px 10px", fontSize: 13, cursor: "pointer", background: C.dk, color: "#fff", border: "none", opacity: apiKey ? 1 : 0.5 }}>
                {fetchState.status === "loading" ? "Pulling…" : "Pull"}
              </button>
            </div>
            {fetchState.msg && <div style={{ ...hint, color: fetchState.status === "err" ? C.flag : C.dk }}>{fetchState.msg}</div>}
            <textarea style={{ ...ta, minHeight: 110 }} value={dkFetched ? Object.values(dkFetched).map((g) => `${g.away} @ ${g.home} ${fmt(g.spread)}`).join("\n") : dkText} onChange={(e) => { setDkFetched(null); setDkText(e.target.value); }} placeholder={"…or paste lines in the same format"} />
            <div style={hint}>{Object.keys(dk).length} games {dkFetched ? "pulled" : "parsed"}</div>
          </div>
          <div>
            <div style={{ ...lbl, color: C.model }}>FTN total DVOA</div>
            <div style={hint}>Paste the team DVOA table (team + total DVOA %). Implied home spread = −((home − away) × pts/DVOA + HFA).</div>
            <textarea style={{ ...ta, minHeight: 90 }} value={dvoaText} onChange={(e) => setDvoaText(e.target.value)} placeholder={"1 DET 31.4%\n2 PHI 28.9%"} />
            <div style={{ ...lbl, color: C.model, marginTop: 10 }}>FTN DVOA game projections</div>
            <div style={hint}>Paste the projections table straight from FTN — including the header row, since it lists home before away. Used instead of the DVOA formula, and drives the "vs FTN" column.</div>
            <textarea style={{ ...ta, minHeight: 90 }} value={projText} onChange={(e) => setProjText(e.target.value)} placeholder={"Week | Home | Away | Home Pts | Away Pts\n2 | BUF | DET | 27.6 | 22.0"} />
            <div style={hint}>{Object.keys(proj).length} projected games{Object.keys(proj).length && !projText ? " (from the scraper)" : ""}</div>
            <div style={{ display: "flex", gap: 14, alignItems: "center", ...hint }}>
              <span>{Object.keys(dvoa).length} teams</span>
              <label>pts per DVOA pt <input type="number" step="0.02" value={k} onChange={(e) => setK(+e.target.value)} style={{ ...box, width: 58, padding: "2px 4px", marginLeft: 4 }} /></label>
              <label>HFA <input type="number" step="0.5" value={hfa} onChange={(e) => setHfa(+e.target.value)} style={{ ...box, width: 48, padding: "2px 4px", marginLeft: 4 }} /></label>
            </div>
          </div>
        </div>

        {/* tiebreakers */}
        {tiebreakers.length > 0 && (
          <div style={{ ...box, marginBottom: 16, overflowX: "auto" }}>
            <div style={{ padding: "10px 14px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.mute }}>
              <b style={{ color: C.ink }}>Tiebreakers</b> · Sunday & Monday night · market over/under and the scores it implies, plus FTN's projected scores when pasted
            </div>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
              <thead>
                <tr style={{ color: C.mute, fontSize: 12, textAlign: "right" }}>
                  <th style={{ textAlign: "left", padding: "8px 14px", fontWeight: 500 }}>Game</th>
                  <th style={{ padding: 8, fontWeight: 500 }}>Spread</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.dk }}>O/U</th>
                  <th style={{ padding: 8, fontWeight: 500 }}>Market implies</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.model }}>FTN projects</th>
                  <th style={{ padding: 8, fontWeight: 500 }}>FTN total</th>
                </tr>
              </thead>
              <tbody>
                {tiebreakers.map((r) => {
                  const im = implied(r), ps = projScoresDerived[r.key];
                  const fmtS = (x) => (x == null ? "—" : x.toFixed(1));
                  return (
                    <tr key={r.key} style={{ borderTop: `1px solid ${C.line}` }}>
                      <td style={{ padding: "9px 14px", fontWeight: 600, whiteSpace: "nowrap" }}>{r.away} <span style={{ color: C.mute, fontWeight: 400 }}>@</span> {r.home} <span style={{ color: C.mute, fontWeight: 400, fontSize: 12 }}>{fmtKo(r.ko)}</span></td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums" }}>{fmt(r.d)}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", fontWeight: 700 }}>{totals[r.key] ?? "—"}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{im ? `${r.away} ${fmtS(im.away)} – ${r.home} ${fmtS(im.home)}` : "—"}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap", color: C.model }}>{ps ? `${r.away} ${fmtS(ps.away)} – ${r.home} ${fmtS(ps.home)}` : "—"}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", color: C.mute }}>{ps ? fmtS(ps.away + ps.home) : "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {/* board */}
        {rows.length === 0 ? (
          <div style={{ ...box, padding: 28, textAlign: "center", color: C.mute, fontSize: 14 }}>
            Paste Yahoo lines and DraftKings lines (or pull them) to see where they disagree. Try the sample week to see the layout.
          </div>
        ) : (
          <div style={{ ...box, overflowX: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.mute }}>
              <span>
                <label>Sort by <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ ...box, padding: "2px 4px" }}>
                  <option value="kickoff">Kickoff</option>
                  <option value="edge">Edge</option>
                </select></label>
                {" "}· Home spread shown; negative = home favored.
              </span>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <label>Market = <select value={marketSrc} onChange={(e) => setMarketSrc(e.target.value)} style={{ ...box, padding: "2px 4px" }}>
                  <option value="dk">DraftKings</option>
                  <option value="consensus" disabled={!Object.keys(consensus).length}>Consensus (all books)</option>
                  <option value="pinnacle" disabled={!Object.keys(pinnacle).length}>Pinnacle</option>
                </select></label>
                <label>Flag at ≥ <input type="number" step="0.5" value={minEdge} onChange={(e) => setMinEdge(+e.target.value)} style={{ ...box, width: 52, padding: "2px 4px" }} /> pts</label>
                <label title="Yahoo must differ from the market by at least this many points to count as an edge">Min mkt gap <input type="number" step="0.5" min="0" value={minMkt} onChange={(e) => setMinMkt(+e.target.value)} style={{ ...box, width: 48, padding: "2px 4px" }} /></label>
                <label title="FTN must differ from Yahoo by at least this many points to be used as the tiebreak">Min FTN gap <input type="number" step="0.5" min="0" value={minFtn} onChange={(e) => setMinFtn(+e.target.value)} style={{ ...box, width: 48, padding: "2px 4px" }} /></label>
                <button onClick={suggest} style={{ ...box, padding: "4px 10px", cursor: "pointer", background: C.ink, color: "#fff", border: "none" }}>Suggest picks</button>
                <button onClick={() => navigator.clipboard && navigator.clipboard.writeText(picksText())} style={{ ...box, padding: "4px 10px", cursor: "pointer" }}>Copy picks</button>
                <button onClick={clearPicks} style={{ ...box, padding: "4px 10px", cursor: "pointer" }}>Clear</button>
                <span>{Object.keys(picks).filter((k) => picks[k]).length}/{nGames} picked</span>
              </div>
            </div>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
              <thead>
                <tr style={{ color: C.mute, fontSize: 12, textAlign: "right" }}>
                  <th style={{ textAlign: "left", padding: "8px 14px", fontWeight: 500 }}>Kickoff</th>
                  <th style={{ textAlign: "left", padding: "8px 14px", fontWeight: 500 }}>Game</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.y }}>Yahoo</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.dk }}>DK</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.dk }}>Vegas</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.model }}>{Object.keys(proj).length ? "FTN proj" : "DVOA est"}</th>
                  <th style={{ padding: 8, fontWeight: 500 }}>vs market</th>
                  <th style={{ padding: 8, fontWeight: 500 }}>vs FTN</th>
                  <th style={{ padding: 8, fontWeight: 500 }}>Crowd</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.ink }}>Pick</th>
                  <th style={{ padding: 8, fontWeight: 600, color: C.ink }}>Conf</th>
                  <th style={{ textAlign: "left", padding: "8px 14px", fontWeight: 500 }}>Read</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => {
                  const flagged = Math.abs(r.mkt ?? 0) >= minEdge;
                  const EdgeCell = ({ v, side }) => (
                    <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", color: v == null ? C.mute : Math.abs(v) >= minEdge ? C.ink : C.mute, fontWeight: v != null && Math.abs(v) >= minEdge ? 600 : 400 }}>
                      {v == null ? "—" : `${Math.abs(v).toFixed(1)} ${side ?? ""}`}
                    </td>
                  );
                  let read = "Lines agree.";
                  if (flagged) {
                    read = `Yahoo gives ${r.mSide} ${Math.abs(r.mkt).toFixed(1)} more than ${marketSrc === "dk" ? "DK" : marketSrc === "pinnacle" ? "Pinnacle" : "Vegas"}`;
                    if (r.keyCross) read += ", across a key number";
                    read += r.agree ? `. ${r.hasProj ? "FTN" : "DVOA est"} agrees.` : r.dSide ? `. ${r.hasProj ? "FTN" : "DVOA est"} leans ${r.dSide}.` : ".";
                  } else if (r.dSide && Math.abs(r.mdl) >= 3) {
                    read = `Market fair; ${r.hasProj ? "FTN" : "DVOA est"} leans ${r.dSide} by ${Math.abs(r.mdl).toFixed(1)}.`;
                  }
                  return (
                    <tr key={r.key} style={{ borderTop: `1px solid ${C.line}`, background: flagged && r.agree ? "#FFF4E8" : flagged ? "#FBFBF6" : picks[r.key] ? "#F4F8FB" : "#fff" }}>
                      <td style={{ padding: "9px 14px", whiteSpace: "nowrap", color: r.started ? C.mute : C.ink, fontSize: 13 }}>{fmtKo(r.ko)}{r.started ? " ✓" : ""}</td>
                      <td style={{ padding: "9px 14px", fontWeight: 600, whiteSpace: "nowrap", opacity: r.started ? 0.6 : 1 }}>
                        {r.away} <span style={{ color: C.mute, fontWeight: 400 }}>@</span> {r.home}
                        {flagged && <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 700, color: "#fff", background: r.agree ? C.flag : C.mute, borderRadius: 3, padding: "1px 6px" }}>{r.mSide}</span>}
                      </td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums" }}>{fmt(r.y)}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", fontWeight: marketSrc === "dk" ? 700 : 400 }}>{fmt(r.dkLine)}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", fontWeight: marketSrc !== "dk" ? 700 : 400 }} title={r.pin != null ? `Pinnacle ${fmt(r.pin)}` : ""}>{fmt(marketSrc === "pinnacle" ? r.pin : r.cons)}</td>
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", color: r.hasProj ? C.model : C.mute }} title={r.hasProj ? "FTN DVOA game projection" : "estimated from season DVOA"}>{r.m == null ? "—" : fmt(+r.m.toFixed(1))}</td>
                      <EdgeCell v={r.mkt} side={r.mSide} />
                      <EdgeCell v={r.mdl} side={r.dSide} />
                      <td style={{ textAlign: "right", padding: 8, fontVariantNumeric: "tabular-nums", color: C.mute, whiteSpace: "nowrap" }}>
                        {pickPct[r.key] ? (() => { const [t, v] = Object.entries(pickPct[r.key]).sort((x, y) => y[1] - x[1])[0]; return `${t} ${v}%`; })() : "—"}
                      </td>
                      <td style={{ padding: 6, whiteSpace: "nowrap" }}>
                        {[r.away, r.home].map((t) => (
                          <button key={t} onClick={() => setPick(r.key, t)} style={{ ...box, padding: "3px 8px", marginRight: 4, cursor: "pointer", fontSize: 13, fontWeight: 600,
                            background: picks[r.key] === t ? C.ink : "#fff", color: picks[r.key] === t ? "#fff" : C.ink, borderColor: picks[r.key] === t ? C.ink : C.line }}>{t}</button>
                        ))}
                      </td>
                      <td style={{ padding: 6 }}>
                        <select value={conf[r.key] || ""} onChange={(e) => setConfidence(r.key, +e.target.value)} style={{ ...box, padding: "3px 4px", fontSize: 13, fontWeight: conf[r.key] ? 700 : 400 }}>
                          <option value="">–</option>
                          {Array.from({ length: nGames }, (_, i) => nGames - i).map((n) => (
                            <option key={n} value={n}>{n}{usedConf.has(n) && conf[r.key] !== n ? " •" : ""}</option>
                          ))}
                        </select>
                      </td>
                      <td style={{ padding: "9px 14px", color: C.mute, fontSize: 13 }}>
                        {read}{why[r.key] ? <span style={{ color: C.model }}>{` · ranked on: ${why[r.key]}`}</span> : null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{ padding: "8px 14px", fontSize: 12, color: C.mute, borderTop: `1px solid ${C.line}` }}>
              Click a team to pick it; choose confidence {nGames} (most sure) down to 1. Picking a number another game holds swaps them. A dot marks numbers already used. "Suggest picks" ranks games where Yahoo is off the market (by at least the min gap) first, then games where FTN disagrees with Yahoo, then plain market favorites — override where you disagree.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
