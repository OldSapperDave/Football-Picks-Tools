name: Pull NFL picks data

on:
  schedule:
    - cron: "0 12 * * 2,4,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Scrape
        env:
          YAHOO_COOKIES: ${{ secrets.YAHOO_COOKIES }}
          FTN_COOKIES: ${{ secrets.FTN_COOKIES }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scrape_picks.py pull
      - name: Keep debug output as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-text
          path: debug_*.txt
      - name: Commit week.json
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add week.json week_paste.txt
          git commit -m "Pull $(date -u +%F)" || echo "nothing changed"
          git push
